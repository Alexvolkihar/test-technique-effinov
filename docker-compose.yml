version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fightclub_php
    volumes:
      - .:/var/www/html
    environment:
      DATABASE_URL: "postgresql://fightclub:fightclub@db:5432/fightclub?serverVersion=16&charset=utf8"
      MAILER_DSN: "smtp://mailpit:1025"
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: fightclub_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  db:
    image: postgres:16-alpine
    container_name: fightclub_db
    environment:
      POSTGRES_DB: fightclub
      POSTGRES_USER: fightclub
      POSTGRES_PASSWORD: fightclub
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: fightclub_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
volumes:
  db_data:

